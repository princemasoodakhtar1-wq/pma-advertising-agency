                                <td className="p-3 flex items-center gap-2"><Music className="w-5 h-5 text-black"/> TikTok</td>
                                <td className="p-3"><span className="bg-green-100 text-green-700 py-1 px-3 rounded-full text-xs">{t.dash.active}</span></td>
                                <td className="p-3">Rs 60,000</td>
                                <td className="p-3">Oct 08, 2026</td>
                                </tr>
                            </tbody>
                            </table>
                        </div>
                        </div>
                    </div>
                    );
                default:
                    return null;
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 font-sans" dir={t.dir}>
                <nav className="bg-white shadow-md sticky top-0 z-50">
                    <div className="max-w-7xl mx-auto px-4">
                    <div className="flex justify-between items-center h-20">
                        {/* Logo */}
                        <div className="flex items-center cursor-pointer" onClick={() => setActiveTab('home')}>
                        <span className="text-3xl font-black text-blue-900 tracking-wider">PMA</span>
                        <span className="text-xl font-light text-gray-600 mx-2">{t.brand}</span>
                        </div>
                        
                        {/* Desktop Navigation */}
                        <div className="hidden md:flex space-x-8 rtl:space-x-reverse items-center">
                        <button onClick={() => setActiveTab('home')} className={`font-semibold ${activeTab === 'home' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'} pb-1 transition`}>{t.nav.home}</button>
                        <button onClick={() => setActiveTab('booking')} className={`font-semibold ${activeTab === 'booking' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'} pb-1 transition`}>{t.nav.booking}</button>
                        <button onClick={() => setActiveTab('dashboard')} className={`font-semibold ${activeTab === 'dashboard' ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-600 hover:text-blue-600'} pb-1 transition`}>{t.nav.dashboard}</button>
                        
                        {/* Language Selector Dropdown */}
                        <div className="relative flex items-center border border-gray-300 rounded-lg px-2 py-1 bg-gray-50">
                            <Globe className="w-4 h-4 text-gray-500 mx-1" />
                            <select 
                            className="bg-transparent text-sm font-medium text-gray-700 outline-none cursor-pointer"
                            value={lang}
                            onChange={(e) => setLang(e.target.value)}
                            >
                            <option value="en">English</option>
                            <option value="ur">اردو (Urdu)</option>
                            <option value="ps">پښتو (Pashto)</option>
                            <option value="ar">العربية (Arabic)</option>
                            <option value="hi">हिंदी (Hindi)</option>
                            <option value="zh">中文 (Chinese)</option>
                            </select>
                        </div>
                        </div>

                        {/* Mobile Menu Button */}
                        <div className="md:hidden flex items-center">
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)} className="text-gray-600 hover:text-blue-600">
                            {isMenuOpen ? <X className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                        </button>
                        </div>
                    </div>
                    </div>

                    {/* Mobile Menu */}
                    {isMenuOpen && (
                    <div className="md:hidden bg-white border-t border-gray-100 px-4 py-4 space-y-4 shadow-inner">
                        <button onClick={() => { setActiveTab('home'); setIsMenuOpen(false); }} className="block w-full text-start font-semibold text-gray-700 hover:text-blue-600">{t.nav.home}</button>
                        <button onClick={() => { setActiveTab('booking'); setIsMenuOpen(false); }} className="block w-full text-start font-semibold text-gray-700 hover:text-blue-600">{t.nav.booking}</button>
                        <button onClick={() => { setActiveTab('dashboard'); setIsMenuOpen(false); }} className="block w-full text-start font-semibold text-gray-700 hover:text-blue-600">{t.nav.dashboard}</button>
                        
                        <div className="pt-2 border-t border-gray-100">
                        <label className="text-sm text-gray-500 mb-1 block">Language</label>
                        <select 
                            className="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 outline-none"
                            value={lang}
                            onChange={(e) => { setLang(e.target.value); setIsMenuOpen(false); }}
                        >
                            <option value="en">English</option>
                            <option value="ur">اردو (Urdu)</option>
                            <option value="ps">پښتو (Pashto)</option>
                            <option value="ar">العربية (Arabic)</option>
                            <option value="hi">हिंदी (Hindi)</option>
                            <option value="zh">中文 (Chinese)</option>
                        </select>
                        </div>
                    </div>
                    )}
                </nav>

                <main className="min-h-[calc(100vh-200px)]">
                    {renderContent()}
                </main>

                <footer className="bg-gray-900 text-white py-12">
                    <div className="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h3 className="text-2xl font-bold mb-4">PMA Advertising Agency</h3>
                        <p className="text-gray-400 mb-6">{t.footer.desc}</p>
                    </div>
                    <div className="space-y-4">
                        <h4 className="text-lg font-semibold border-b border-gray-700 pb-2 mb-4 inline-block">{t.footer.contact}</h4>
                        <p className="flex items-center gap-3 text-gray-300">
                        <Phone className="w-5 h-5 text-blue-400" />
                        <span dir="ltr">0370 4093 197</span>
                        </p>
                        <p className="flex items-center gap-3 text-gray-300">
                        <MapPin className="w-5 h-5 text-blue-400" />
                        Dargai Bazar, Malakand Agency
                        </p>
                        <p className="flex items-center gap-3 text-gray-300">
                        <Mail className="w-5 h-5 text-blue-400" />
                        info@pmaagency.com
                        </p>
                    </div>
                    </div>
                    <div className="text-center text-gray-500 mt-12 pt-8 border-t border-gray-800 text-sm">
                    &copy; {new Date().getFullYear()} PMA Advertising Agency. {t.footer.rights}
                    </div>
                </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
